name: Release Plugin

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Verify tag matches version
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          PROJECT_VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)

          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match gradle.properties version ($PROJECT_VERSION)"
            exit 1
          fi

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Locate plugin ZIP
        id: artifact
        run: |
          ZIP_FILE=$(find build/distributions -name "*.zip" | head -n 1)
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: ${{ steps.artifact.outputs.zip_file }}
